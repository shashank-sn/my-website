<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hero test</title>
  <style>
    body{margin:0;background:#08090a;display:flex;align-items:center;justify-content:center;min-height:100vh}
    canvas{display:block;max-width:580px;width:100%}
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const W = 960, H = 240, S = 3, STEP = 2, CYCLE = 5000;
canvas.width = W; canvas.height = H;
canvas.style.width = Math.min(innerWidth * 0.9, 580) + 'px';
canvas.style.height = canvas.style.width * H / W + 'px';

const img = new Image();
img.src = 'hero-thumbnail.svg';

const whiteP = [], greyP = [];
let cycleTime = 0, lastTime = performance.now();

function easeOutBack(t) { const c = 1.70158; return 1 + (c + 1) * (t-1)**3 + c * (t-1)**2; }
function easeInQuad(t) { return t * t; }
function lerp(a,b,v) { return a + (b-a) * v; }
function clamp(v,a,b) { return v<a?a:v>b?b:v; }

function initAnimation() {
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  const octx = off.getContext('2d');
  octx.fillStyle = '#08090a';
  octx.fillRect(0, 0, W, H);
  octx.drawImage(img, 0, 10, W, H - 20);
  const data = octx.getImageData(0, 0, W, H).data;
  for (let y = 0; y < H; y += STEP) {
    for (let x = 0; x < W; x += STEP) {
      const i = (y * W + x) * 4;
      if (data[i+3] < 15) continue;
      const brightness = (data[i] + data[i+1] + data[i+2]) / 3;
      const p = {
        tx: x, ty: y,
        x: x + (Math.random()-0.5)*W*1.5,
        y: y + (Math.random()-0.5)*H*1.5,
        size: S + Math.random()*1.6,
      };
      if (brightness > 170) whiteP.push({...p, color:'#EEEDED'});
      else if (brightness > 60) greyP.push({...p, color:'#828281'});
    }
  }
}

function tick(now) {
  const dt = now - lastTime;
  lastTime = now;
  cycleTime = (cycleTime + dt) % CYCLE;
  const t = cycleTime / CYCLE;

  ctx.fillStyle = '#08090a';
  ctx.fillRect(0, 0, W, H);

  const whiteT = clamp((t-0.0)/0.32, 0, 1);
  const greyT = clamp((t-0.34)/0.04, 0, 1);
  const isGlitch = t>0.36 && t<0.39;
  const hold = t>0.40 && t<0.83;
  const sweepT = clamp((t-0.41)/0.25, 0, 1);
  const sweepP = Math.sin(sweepT*Math.PI);
  const breakT = clamp((t-0.83)/0.16, 0, 1);

  const all = [...whiteP, ...greyP];

  all.forEach((p, i) => {
    const isW = i < whiteP.length;
    const local = isW ? whiteT : (whiteT>0.95 ? greyT : 0);
    const progressed = easeOutBack(local);

    let tx = p.tx, ty = p.ty;

    if (isGlitch && !isW) {
      tx += (Math.random()-0.5)*6;
      ty += (Math.random()-0.5)*2;
    }

    if (breakT > 0.01) {
      const bp = easeInQuad(breakT);
      tx += (Math.random()-0.5)*W*bp;
      ty += (Math.random()-0.5)*H*bp;
    }

    p.x = lerp(p.x, tx, progressed<0.5?0.25:0.14);
    p.y = lerp(p.y, ty, progressed<0.5?0.25:0.14);

    const flicker = hold ? 1+(Math.random()-0.5)*0.03 : 1;
    const alpha = t<0.005||t>0.995 ? 0.05+Math.random()*0.05
      : clamp(0.78+sweepP*0.22+progressed*0.1, 0, 1);

    ctx.fillStyle = p.color;
    ctx.globalAlpha = alpha*flicker;
    ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size);
  });

  if (sweepP > 0.01) {
    const sx = sweepT * W;
    const g = ctx.createRadialGradient(sx,H/2,0,sx,H/2,W*0.5);
    g.addColorStop(0, 'rgba(240,165,74,0.07)');
    g.addColorStop(1, 'rgba(240,165,74,0)');
    ctx.globalAlpha = sweepP*0.6;
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
  }

  ctx.globalAlpha = 1;
  requestAnimationFrame(tick);
}

img.onload = () => { initAnimation(); requestAnimationFrame(tick); };
  </script>
</body>
</html>
